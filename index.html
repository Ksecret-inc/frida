<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 대시보드</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --dim: #d9d8d1;
  --hover: rgba(11,11,11,0.05);
  --seq-lo: #cde2fb;
  --seq-hi: #104281;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --dim: #383835;
    --hover: rgba(255,255,255,0.06);
    --seq-lo: #1c3350;
    --seq-hi: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --accent: #3987e5;
  --dim: #383835;
  --hover: rgba(255,255,255,0.06);
  --seq-lo: #1c3350;
  --seq-hi: #86b6ef;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin: 4px 0 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button.btn {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button.btn:hover { background: var(--hover); }
button.btn:disabled { opacity: .5; cursor: default; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.filters { display: grid; gap: 10px; margin-bottom: 16px; }
.frow { display: flex; gap: 10px; align-items: flex-start; }
.flabel { flex: 0 0 40px; color: var(--ink-2); font-weight: 600; padding-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 13px; color: var(--ink-2); background: transparent;
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.chip:hover { background: var(--hover); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.all[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.hint { color: var(--muted); font-size: 12px; margin: 2px 0 0 50px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi .k { color: var(--ink-2); font-size: 13px; }
.kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.kpi .d { color: var(--muted); font-size: 12px; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.span2 { grid-column: 1 / -1; }
.panel h2 { font-size: 15px; margin: 0; }
.panel .cap { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: inherit; }
.hit { cursor: pointer; }
.hit:hover .bar { filter: brightness(1.08); }
.hit:hover .bg { fill: var(--hover); }

.tip {
  position: fixed; pointer-events: none; z-index: 10; opacity: 0; transition: opacity .08s;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  white-space: nowrap;
}
.tip b { display: block; font-size: 13px; margin-bottom: 2px; }
.tip .r { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); }
.tip .r span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }

.tablewrap { max-height: 420px; overflow: auto; border-top: 1px solid var(--grid); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 600; cursor: pointer; user-select: none; }
th:hover { color: var(--ink); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--hover); }
.status { color: var(--muted); font-size: 12px; }

@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .kpi .v { font-size: 22px; }
}
@media (max-width: 480px) {
  .frow { flex-direction: column; gap: 4px; }
  .flabel { padding-top: 0; }
  .hint { margin-left: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>매출 대시보드</h1>
      <p class="sub" id="period"></p>
    </div>
    <div class="actions">
      <span class="status" id="status"></span>
      <button class="btn" id="reload" title="구글 시트에서 최신 데이터를 다시 불러옵니다">시트에서 새로고침</button>
      <button class="btn" id="reset">필터 초기화</button>
    </div>
  </header>

  <section class="panel filters" aria-label="필터">
    <div class="frow"><div class="flabel">월</div><div class="chips" id="f-month"></div></div>
    <div class="frow"><div class="flabel">제품</div><div class="chips" id="f-product"></div></div>
    <div class="frow"><div class="flabel">채널</div><div class="chips" id="f-channel"></div></div>
    <p class="hint">버튼을 눌러 여러 개를 고를 수 있어요. 아래 차트의 막대나 칸을 눌러도 필터가 걸려요.</p>
  </section>

  <section class="kpis" aria-label="요약 지표">
    <div class="panel kpi"><div class="k">총 매출</div><div class="v" id="k-rev">-</div><div class="d" id="k-rev-d"></div></div>
    <div class="panel kpi"><div class="k">판매 수량</div><div class="v" id="k-qty">-</div><div class="d" id="k-qty-d"></div></div>
    <div class="panel kpi"><div class="k">평균 할인율</div><div class="v" id="k-disc">-</div><div class="d">정가 대비 실제 매출 기준</div></div>
    <div class="panel kpi"><div class="k">월평균 매출</div><div class="v" id="k-avg">-</div><div class="d" id="k-avg-d"></div></div>
  </section>

  <section class="grid">
    <div class="panel span2">
      <h2>월별 매출</h2>
      <p class="cap">막대를 누르면 그 달만 볼 수 있어요.</p>
      <div class="chart" id="c-month"></div>
    </div>
    <div class="panel">
      <h2>제품별 매출</h2>
      <p class="cap">막대를 누르면 해당 제품으로 필터돼요.</p>
      <div class="chart" id="c-product"></div>
    </div>
    <div class="panel">
      <h2>채널별 매출</h2>
      <p class="cap">막대를 누르면 해당 채널로 필터돼요.</p>
      <div class="chart" id="c-channel"></div>
    </div>
    <div class="panel span2">
      <h2>제품 × 채널 매출</h2>
      <p class="cap">색이 진할수록 매출이 커요. 칸을 누르면 그 제품·채널 조합만 볼 수 있어요.</p>
      <div class="chart" id="c-heat"></div>
    </div>
    <div class="panel span2">
      <h2>상세 데이터</h2>
      <p class="cap" id="t-cap"></p>
      <div class="tablewrap">
        <table>
          <thead><tr id="t-head"></tr></thead>
          <tbody id="t-body"></tbody>
        </table>
      </div>
    </div>
  </section>
</div>
<div class="tip" id="tip"></div>

let rows = [];
const F = { month: new Set(), product: new Set(), channel: new Set() };
const DIMS = ["month", "product", "channel"];
let sortKey = "month", sortDir = 1;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const uniq = (arr) => [...new Set(arr)];

function load(raw) {
  rows = raw.map(r => ({ month: r[0], product: r[1], channel: r[2], qty: +r[3], price: +r[4], disc: +r[5], rev: +r[6] }));
  for (const d of DIMS) {
    const keys = new Set(rows.map(r => r[d]));
    for (const v of [...F[d]]) if (!keys.has(v)) F[d].delete(v);
  }
  buildChips();
  render();
}

// 표시 순서: 월은 시간순, 제품·채널은 시트에 나온 순서
const order = d => d === "month" ? uniq(rows.map(r => r.month)).sort() : uniq(rows.map(r => r[d]));

// ---------- 숫자 포맷 ----------
function won(v) {
  if (v >= 1e8) return (v / 1e8).toFixed(v >= 1e10 ? 0 : 1).replace(/\.0$/, "") + "억원";
  if (v >= 1e4) return Math.round(v / 1e4).toLocaleString("ko-KR") + "만원";
  return Math.round(v).toLocaleString("ko-KR") + "원";
}
function wonShort(v) {
  if (v >= 1e8) return (v / 1e8).toFixed(1).replace(/\.0$/, "") + "억";
  if (v >= 1e4) return Math.round(v / 1e4).toLocaleString("ko-KR") + "만";
  return Math.round(v).toLocaleString("ko-KR");
}
const num = v => Math.round(v).toLocaleString("ko-KR");
const monthLabel = m => { const [y, mm] = m.split("-"); return `${+mm}월`; };
const monthFull = m => { const [y, mm] = m.split("-"); return `${y}년 ${+mm}월`; };
const labelOf = (d, v) => d === "month" ? monthLabel(v) : v;

// ---------- 필터 ----------
function match(r, except) {
  return DIMS.every(d => d === except || F[d].size === 0 || F[d].has(r[d]));
}
function toggle(d, v) {
  if (F[d].has(v)) F[d].delete(v); else F[d].add(v);
  render();
}
function buildChips() {
  for (const d of DIMS) {
    const box = $("f-" + d);
    box.innerHTML = "";
    const all = document.createElement("button");
    all.className = "chip all"; all.textContent = "전체"; all.dataset.all = "1";
    all.onclick = () => { F[d].clear(); render(); };
    box.appendChild(all);
    for (const v of order(d)) {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = labelOf(d, v); b.dataset.v = v;
      b.title = d === "month" ? monthFull(v) : v;
      b.onclick = () => toggle(d, v);
      box.appendChild(b);
    }
  }
}
function syncChips() {
  for (const d of DIMS) {
    for (const b of $("f-" + d).children) {
      const on = b.dataset.all ? F[d].size === 0 : F[d].has(b.dataset.v);
      b.setAttribute("aria-pressed", on);
    }
  }
}

function agg(list, key) {
  const m = new Map();
  for (const r of list) {
    const k = typeof key === "function" ? key(r) : r[key];
    const a = m.get(k) || { rev: 0, qty: 0, list: 0 };
    a.rev += r.rev; a.qty += r.qty; a.list += r.qty * r.price;
    m.set(k, a);
  }
  return m;
}

// ---------- 툴팁 ----------
const tip = $("tip");
function showTip(e, title, lines) {
  tip.innerHTML = `<b>${title}</b>` + lines.map(([k, v]) => `<div class="r"><span>${k}</span><span>${v}</span></div>`).join("");
  tip.style.opacity = 1;
  moveTip(e);
}
function moveTip(e) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
function tipLines(a) {
  const disc = a.list ? (1 - a.rev / a.list) * 100 : 0;
  return [["매출", won(a.rev)], ["판매 수량", num(a.qty) + "개"], ["평균 할인율", disc.toFixed(1) + "%"]];
}

// ---------- SVG 도우미 ----------
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, attrs) {
  const t = el("text", Object.assign({ x, y, "font-size": 12, fill: css("--muted") }, attrs), parent);
  t.textContent = s;
  return t;
}
// 끝쪽만 4px 둥근 막대
function barPath(x, y, w, h, dir) {
  const r = Math.min(4, (dir === "up" ? w : h) / 2, dir === "up" ? h : w);
  if (h <= 0 || w <= 0) return "";
  if (dir === "up") return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
function barColor(d, key) {
  return F[d].size === 0 || F[d].has(key) ? css("--accent") : css("--dim");
}

// 세로 막대 (월별)
function drawColumns(box, d, items) {
  const W = Math.max(320, box.clientWidth), H = 260, m = { t: 22, r: 8, b: 26, l: 48 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "월별 매출 막대 차트" });
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = niceMax(Math.max(...items.map(i => i.a.rev), 0));
  for (let i = 0; i <= 4; i++) {
    const y = m.t + ih - ih * i / 4;
    el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: i ? css("--grid") : css("--axis"), "stroke-width": 1 }, svg);
    txt(svg, m.l - 8, y + 4, wonShort(max * i / 4), { "text-anchor": "end" });
  }
  const step = iw / items.length, bw = Math.min(56, step * 0.62);
  const peak = items.reduce((p, c) => (c.a.rev > (p ? p.a.rev : -1) ? c : p), null);
  items.forEach((it, i) => {
    const cx = m.l + step * i + step / 2, h = ih * it.a.rev / max;
    const g = el("g", { class: "hit", tabindex: 0, role: "button", "aria-label": `${monthFull(it.key)} ${won(it.a.rev)}` }, svg);
    el("rect", { class: "bg", x: cx - step / 2, y: m.t, width: step, height: ih, fill: "transparent", rx: 6 }, g);
    el("path", { class: "bar", d: barPath(cx - bw / 2, m.t + ih - h, bw, h, "up"), fill: barColor(d, it.key) }, g);
    txt(g, cx, H - 8, monthLabel(it.key), { "text-anchor": "middle", fill: css("--ink-2") });
    const sel = F[d].has(it.key);
    if (it === peak || sel) txt(g, cx, m.t + ih - h - 6, wonShort(it.a.rev), { "text-anchor": "middle", fill: css("--ink"), "font-weight": 600 });
    bindHit(g, d, it.key, monthFull(it.key), it.a);
  });
  box.replaceChildren(svg);
}

// 가로 막대 (제품·채널)
function drawRows(box, d, items) {
  const W = Math.max(300, box.clientWidth), rowH = 40, m = { t: 4, r: 64, b: 4, l: Math.min(150, W * 0.36) };
  const H = m.t + m.b + rowH * items.length;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "막대 차트" });
  const iw = W - m.l - m.r, bh = 18;
  const max = Math.max(...items.map(i => i.a.rev), 1);
  el("line", { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b, stroke: css("--axis") }, svg);
  items.forEach((it, i) => {
    const y = m.t + rowH * i, w = iw * it.a.rev / max;
    const g = el("g", { class: "hit", tabindex: 0, role: "button", "aria-label": `${it.key} ${won(it.a.rev)}` }, svg);
    el("rect", { class: "bg", x: 0, y: y + 2, width: W, height: rowH - 4, fill: "transparent", rx: 6 }, g);
    const lab = txt(g, m.l - 10, y + rowH / 2 + 4, it.key, { "text-anchor": "end", fill: css("--ink-2"), "font-size": 13 });
    clip(lab, m.l - 16);
    el("path", { class: "bar", d: barPath(m.l, y + (rowH - bh) / 2, w, bh, "right"), fill: barColor(d, it.key) }, g);
    txt(g, m.l + w + 6, y + rowH / 2 + 4, wonShort(it.a.rev), { fill: css("--ink"), "font-weight": 600 });
    bindHit(g, d, it.key, it.key, it.a);
  });
  box.replaceChildren(svg);
}
function clip(t, maxW) {
  requestAnimationFrame(() => {
    if (!t.getComputedTextLength) return;
    let s = t.textContent;
    while (s.length > 2 && t.getComputedTextLength() > maxW) { s = s.slice(0, -1); t.textContent = s + "…"; }
  });
}
function bindHit(g, d, key, title, a) {
  g.addEventListener("click", () => { hideTip(); toggle(d, key); });
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(d, key); } });
  g.addEventListener("mouseenter", e => showTip(e, title, tipLines(a)));
  g.addEventListener("mousemove", moveTip);
  g.addEventListener("mouseleave", hideTip);
}

// 히트맵 (제품 × 채널)
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function drawHeat(box, list) {
  const prods = order("product"), chans = order("channel");
  const a = agg(list, r => r.product + "\u0001" + r.channel);
  const W = Math.max(320, box.clientWidth), m = { t: 28, r: 4, b: 4, l: Math.min(150, W * 0.3) }, ch = 40;
  const H = m.t + m.b + ch * prods.length;
  const cw = (W - m.l - m.r) / chans.length;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "제품별 채널별 매출 히트맵" });
  const vals = [...a.values()].map(v => v.rev);
  const max = Math.max(...vals, 1), min = Math.min(...vals, max);
  const lo = css("--seq-lo"), hi = css("--seq-hi");
  const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  chans.forEach((c, j) => txt(svg, m.l + cw * j + cw / 2, 18, c, { "text-anchor": "middle", fill: css("--ink-2"), "font-size": 13 }));
  prods.forEach((p, i) => {
    const y = m.t + ch * i;
    clip(txt(svg, m.l - 10, y + ch / 2 + 4, p, { "text-anchor": "end", fill: css("--ink-2"), "font-size": 13 }), m.l - 16);
    chans.forEach((c, j) => {
      const v = a.get(p + "\u0001" + c);
      const x = m.l + cw * j;
      const g = el("g", { class: "hit", tabindex: 0, role: "button", "aria-label": `${p} ${c} ${v ? won(v.rev) : "데이터 없음"}` }, svg);
      const t = v ? (max === min ? 1 : (v.rev - min) / (max - min)) : 0;
      const fill = v ? mix(lo, hi, 0.08 + t * 0.92) : css("--grid");
      const active = (F.product.size === 0 || F.product.has(p)) && (F.channel.size === 0 || F.channel.has(c));
      el("rect", { class: "bar", x: x + 1, y: y + 1, width: cw - 2, height: ch - 2, rx: 4, fill, opacity: active ? 1 : 0.25 }, g);
      const lightText = dark ? t < 0.55 : t > 0.5;
      if (v) txt(g, x + cw / 2, y + ch / 2 + 4, wonShort(v.rev), { "text-anchor": "middle", fill: lightText ? "#ffffff" : "#0b0b0b", "font-size": 12, "font-weight": 600 });
      g.addEventListener("click", () => {
        hideTip();
        const only = F.product.size === 1 && F.product.has(p) && F.channel.size === 1 && F.channel.has(c);
        F.product.clear(); F.channel.clear();
        if (!only) { F.product.add(p); F.channel.add(c); }
        render();
      });
      if (v) {
        g.addEventListener("mouseenter", e => showTip(e, `${p} · ${c}`, tipLines(v)));
        g.addEventListener("mousemove", moveTip);
        g.addEventListener("mouseleave", hideTip);
      }
    });
  });
  box.replaceChildren(svg);
}

// ---------- 표 ----------
const COLS = [
  ["month", "월", false], ["product", "제품", false], ["channel", "채널", false],
  ["qty", "판매수량", true], ["price", "정가(원)", true], ["disc", "할인율(%)", true], ["rev", "매출(원)", true],
];
function drawTable(list) {
  $("t-head").innerHTML = COLS.map(([k, l, n]) =>
    `<th class="${n ? "n" : ""}" data-k="${k}">${l}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  for (const th of $("t-head").children) th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = COLS.find(c => c[0] === k)[2] ? -1 : 1; }
    render();
  };
  const sorted = [...list].sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
  });
  $("t-body").innerHTML = sorted.map(r => `<tr><td>${r.month}</td><td>${r.product}</td><td>${r.channel}</td>` +
    `<td class="n">${num(r.qty)}</td><td class="n">${num(r.price)}</td><td class="n">${r.disc}</td><td class="n">${num(r.rev)}</td></tr>`).join("");
  $("t-cap").textContent = `${list.length}개 행 · 머리글을 누르면 정렬돼요.`;
}

// ---------- 전체 그리기 ----------
function render() {
  syncChips();
  const list = rows.filter(r => match(r));
  const months = order("month");
  $("period").textContent = months.length ? `${monthFull(months[0])} ~ ${monthFull(months[months.length - 1])} · 제품 ${order("product").length}종 · 채널 ${order("channel").length}곳` : "";

  const tot = list.reduce((a, r) => (a.rev += r.rev, a.qty += r.qty, a.list += r.qty * r.price, a), { rev: 0, qty: 0, list: 0 });
  const nMonths = new Set(list.map(r => r.month)).size;
  const all = rows.reduce((s, r) => s + r.rev, 0);
  $("k-rev").textContent = won(tot.rev);
  $("k-rev-d").textContent = all ? `전체의 ${(tot.rev / all * 100).toFixed(1)}%` : "";
  $("k-qty").textContent = num(tot.qty) + "개";
  $("k-qty-d").textContent = tot.qty ? `개당 평균 ${num(tot.rev / tot.qty)}원` : "";
  $("k-disc").textContent = tot.list ? ((1 - tot.rev / tot.list) * 100).toFixed(1) + "%" : "-";
  $("k-avg").textContent = nMonths ? won(tot.rev / nMonths) : "-";
  $("k-avg-d").textContent = nMonths ? `${nMonths}개월 기준` : "";

  // 각 차트는 자기 차원을 뺀 나머지 필터만 적용하고, 선택한 항목을 강조
  const sub = d => rows.filter(r => match(r, d));
  const am = agg(sub("month"), "month");
  drawColumns($("c-month"), "month", months.map(k => ({ key: k, a: am.get(k) || { rev: 0, qty: 0, list: 0 } })));
  for (const d of ["product", "channel"]) {
    const ad = agg(sub(d), d);
    const items = order(d).map(k => ({ key: k, a: ad.get(k) || { rev: 0, qty: 0, list: 0 } })).sort((a, b) => b.a.rev - a.a.rev);
    drawRows($("c-" + d), d, items);
  }
  drawHeat($("c-heat"), rows.filter(r => match(r, "product") && match(r, "channel") && (F.month.size === 0 || F.month.has(r.month))));
  drawTable(list);
}

// ---------- 시트에서 새로고침 ----------
function parseCSV(text) {
  const out = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); out.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(v => v.trim() !== ""));
}
async function reload() {
  const btn = $("reload"), st = $("status");
  btn.disabled = true; st.textContent = "불러오는 중…";
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = parseCSV(await res.text());
    const head = data.shift().map(h => h.trim());
    const idx = ["월", "제품", "채널", "판매수량", "정가(원)", "할인율(%)", "매출(원)"].map(h => head.indexOf(h));
    if (idx.includes(-1)) throw new Error("시트의 열 이름이 바뀌었어요");
    const raw = data.map(r => idx.map(i => (r[i] || "").replace(/,/g, "").trim())).filter(r => r[0] && r[6] !== "");
    if (!raw.length) throw new Error("데이터가 비어 있어요");
    load(raw);
    st.textContent = `시트 데이터 ${raw.length}행 · ${new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })} 갱신`;
  } catch (e) {
    st.textContent = "불러오기 실패: " + e.message + " (내장 데이터를 계속 사용해요)";
  } finally { btn.disabled = false; }
}

$("reload").onclick = reload;
$("reset").onclick = () => { DIMS.forEach(d => F[d].clear()); render(); };
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

load(EMBEDDED);
$("status").textContent = "내장 데이터 기준";
</script>
